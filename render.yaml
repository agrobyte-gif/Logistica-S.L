# Blueprint de Render para la API AGROGOOD (opción alternativa a Railway).
# Crea el servicio con: Render Dashboard → New → Blueprint → apunta a este repo.
# La base de datos va en Neon (externa); aquí solo se configura la API.
services:
  - type: web
    name: agrogood-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    # Aplica el esquema antes de arrancar. Para el PRIMER despliegue usa db push;
    # cuando haya migraciones versionadas, cámbialo por `npx prisma migrate deploy`.
    preDeployCommand: cd apps/api && npx prisma db push --skip-generate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false # pega la cadena pooled de Neon en el dashboard
      - key: CORS_ORIGIN
        sync: false # tu dominio de Vercel, p. ej. https://tu-app.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: COOKIE_SECURE
        value: "true"
      - key: THROTTLE_TTL
        value: "60"
      - key: THROTTLE_LIMIT
        value: "120"
