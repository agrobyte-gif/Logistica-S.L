services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agrogood-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrogood
      POSTGRES_PASSWORD: agrogood_dev
      POSTGRES_DB: agrogood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrogood -d agrogood"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
